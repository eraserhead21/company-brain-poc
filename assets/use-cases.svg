<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-labelledby="title desc">
  <title id="title">Use cases</title>
  <desc id="desc">Four use cases. Retrieve sanitised knowledge: AI assistants quote project knowledge without exposing personal or commercial data. Learn from other teams: a person on one team reuses another team's lessons without asking around. Self-serve onboarding: a new team member queries the knowledge base to get up to speed, saving productive hours for the team. Transparent conflict-flagging: conflicts between documents go to a person, instead of an AI assistant making the decision.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #111827; }
    .cap { font-size: 14.5px; fill: #4B5563; }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="323" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- 1: Retrieve sanitised knowledge -->
  <rect x="32" y="32" width="556" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <circle cx="92" cy="92" r="32" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <path d="M 92 76 L 105 81.5 V 92 C 105 100 99 105 92 108 C 85 105 79 100 79 92 V 81.5 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 86 92 L 90.5 96.5 L 98.5 87.5" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="title" x="144" y="78">Retrieve sanitised knowledge</text>
  <text class="cap" x="144" y="104">AI assistants quote project knowledge without</text>
  <text class="cap" x="144" y="124">exposing personal or commercial data.</text>

  <!-- 2: Learn from other teams -->
  <rect x="612" y="32" width="556" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <circle cx="672" cy="92" r="32" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="661" cy="85" r="5.5" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 651 102 C 651 95 671 95 671 102" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="684" cy="85" r="5.5" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 674 102 C 674 95 694 95 694 102" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <path d="M 664 72 C 668 68 677 68 681 72" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 678 69 L 681 72 L 677 74" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="title" x="724" y="78">Learn from other teams</text>
  <text class="cap" x="724" y="104">A person on one team reuses another team's</text>
  <text class="cap" x="724" y="124">lessons without asking around.</text>

  <!-- 3: Self-serve onboarding -->
  <rect x="32" y="172" width="556" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <circle cx="92" cy="232" r="32" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="88" cy="228" r="10" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 95.5 235.5 L 104 244" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
  <text class="title" x="144" y="218">Self-serve onboarding</text>
  <text class="cap" x="144" y="244">A new team member queries the knowledge base to</text>
  <text class="cap" x="144" y="264">get up to speed, saving productive hours for the team.</text>

  <!-- 4: Transparent conflict-flagging -->
  <rect x="612" y="172" width="556" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <circle cx="672" cy="232" r="32" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <path d="M 672 217 L 687 244 H 657 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 672 227 V 235" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="672" cy="240" r="1.4" fill="#4F46E5"/>
  <text class="title" x="724" y="218">Transparent conflict-flagging</text>
  <text class="cap" x="724" y="244">Conflicts between documents go to a person,</text>
  <text class="cap" x="724" y="264">instead of an AI assistant making the decision.</text>
</svg>
