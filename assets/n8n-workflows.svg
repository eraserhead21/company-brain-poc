<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="title desc">
  <title id="title">The four n8n workflows</title>
  <desc id="desc">W1 Capture checks the Drive folder every minute for new documents. Claude Haiku writes one card, and a redaction check tests it. A clean card opens a pull request; a card that is not clean is held for a person and no card is written. A person merges the pull request into the main branch, which holds only approved cards and brief.md. W3 Ask the brain is an MCP server that requires a Bearer token. Claude Desktop or any AI assistant calls its two tools: search_approved_cards runs W3a Card search and returns up to 3 cards with IDs, and get_brief returns brief.md. Both read only the main branch. If no card matches, it replies "No approved learning covers this." If W1, W3 or W3a fails in a real run, W2 Error alerts sends an email with the failed step, the error and a link to the run.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .h1 { font-size: 26px; font-weight: 600; fill: #111827; }
    .sub { font-size: 17px; fill: #4B5563; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; fill: #6B7280; }
    .lmeta { font-size: 13.5px; fill: #6B7280; }
    .node { font-size: 16px; font-weight: 600; fill: #111827; }
    .cap { font-size: 13.5px; fill: #4B5563; }
    .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 15px; font-weight: 600; fill: #312E81; }
    .edge { font-size: 12px; fill: #6B7280; }
    .note { font-size: 12.5px; fill: #4B5563; }
    .quote { font-size: 12.5px; font-style: italic; fill: #111827; }
    .bar { font-size: 15px; font-weight: 600; fill: #065F46; }
    .barcap { font-size: 15px; fill: #4B5563; }
    .red { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; fill: #B91C1C; }
    .redcap { font-size: 13.5px; fill: #4B5563; }
    .chip { font-size: 13px; fill: #991B1B; }
    .redge { font-size: 11px; font-weight: 600; fill: #B91C1C; }
    .foot { font-size: 15px; font-weight: 600; fill: #065F46; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="729" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <text class="h1" x="48" y="56">Four n8n workflows, one rule</text>
  <text class="sub" x="48" y="88">Assistants read only what a person approved. W2 watches the other three.</text>

  <!-- W1 lane -->
  <rect x="36" y="120" width="916" height="226" rx="14" fill="#FCFCFD" stroke="#E5E7EB"/>
  <text class="label" x="56" y="150">W1 CAPTURE</text>
  <text class="lmeta" x="160" y="150">checks the Drive folder every minute, new documents only</text>

  <rect x="56" y="176" width="140" height="76" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text class="node" x="126" y="209" text-anchor="middle">New Google Doc</text>
  <text class="cap" x="126" y="231" text-anchor="middle">downloaded as text</text>

  <line x1="196" y1="214" x2="232" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="236" y="176" width="160" height="76" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="node" x="316" y="209" text-anchor="middle">Claude Haiku</text>
  <text class="cap" x="316" y="231" text-anchor="middle">writes one card</text>

  <line x1="396" y1="214" x2="432" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="436" y="176" width="160" height="76" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="node" x="516" y="209" text-anchor="middle">Redaction check</text>
  <text class="cap" x="516" y="231" text-anchor="middle">pattern check</text>

  <line x1="596" y1="214" x2="632" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 672 178 L 708 214 L 672 250 L 636 214 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="cap" x="672" y="219" text-anchor="middle">Clean?</text>

  <line x1="708" y1="214" x2="768" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="738" y="206" text-anchor="middle">yes</text>

  <rect x="772" y="176" width="160" height="76" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text class="node" x="852" y="209" text-anchor="middle">Pull request</text>
  <text class="cap" x="852" y="231" text-anchor="middle">branch and card file</text>

  <line x1="672" y1="250" x2="672" y2="276" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="682" y="268">no</text>

  <rect x="592" y="280" width="160" height="52" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text class="node" x="672" y="302" text-anchor="middle">Held for a person</text>
  <text class="cap" x="672" y="322" text-anchor="middle">no card written</text>

  <line x1="852" y1="252" x2="852" y2="276" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="772" y="280" width="160" height="52" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text class="node" x="852" y="302" text-anchor="middle" fill="#065F46">A person merges</text>
  <text class="cap" x="852" y="322" text-anchor="middle">approves the card</text>

  <line x1="852" y1="332" x2="852" y2="368" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="862" y="362">writes to main</text>

  <!-- The approved store -->
  <rect x="36" y="372" width="916" height="48" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <circle cx="64" cy="396" r="11" fill="#059669"/>
  <path d="M 59 396 L 62.5 399.5 L 69 392.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="401"><tspan class="bar">main branch on GitHub</tspan><tspan class="barcap" dx="10">learnings/approved/ and brief.md, approved content only</tspan></text>

  <!-- W3 lane -->
  <rect x="36" y="446" width="916" height="204" rx="14" fill="#FCFCFD" stroke="#E5E7EB"/>
  <text class="label" x="56" y="476">W3 ASK THE BRAIN</text>
  <text class="lmeta" x="210" y="476">an MCP server, with W3a Card search behind one tool</text>

  <line x1="466" y1="496" x2="466" y2="424" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="476" y="438">reads cards</text>
  <line x1="766" y1="496" x2="766" y2="424" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="776" y="438">reads brief.md</text>

  <rect x="56" y="496" width="220" height="58" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="4 3"/>
  <text class="note" x="72" y="516">No match? It replies:</text>
  <text class="quote" x="72" y="533">"No approved learning</text>
  <text class="quote" x="72" y="548">covers this."</text>
  <line x1="276" y1="525" x2="316" y2="525" stroke="#D1D5DB" stroke-width="1.6" stroke-dasharray="3 3"/>

  <rect x="316" y="496" width="300" height="58" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="mono" x="466" y="520" text-anchor="middle">search_approved_cards</text>
  <text class="cap" x="466" y="542" text-anchor="middle">runs W3a: up to 3 cards with IDs</text>

  <rect x="656" y="496" width="220" height="58" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="mono" x="766" y="520" text-anchor="middle">get_brief</text>
  <text class="cap" x="766" y="542" text-anchor="middle">returns brief.md</text>

  <line x1="466" y1="582" x2="466" y2="558" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766" y1="582" x2="766" y2="558" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="316" y="582" width="560" height="52" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="338" y="603" width="16" height="13" rx="2" fill="none" stroke="#374151" stroke-width="1.8"/>
  <path d="M 341 603 V 599 A 5 5 0 0 1 351 599 V 603" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text class="node" x="366" y="614">W3 MCP server</text>
  <text class="cap" x="490" y="614">two tools, requires the Bearer token</text>

  <rect x="56" y="582" width="220" height="52" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <path d="M 82 592 L 84.5 600.5 L 93 603 L 84.5 605.5 L 82 614 L 79.5 605.5 L 71 603 L 79.5 600.5 Z" fill="#4F46E5"/>
  <text class="node" x="104" y="604">Claude Desktop</text>
  <text class="cap" x="104" y="623">or any AI assistant</text>

  <line x1="276" y1="608" x2="312" y2="608" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="edge" x="294" y="600" text-anchor="middle">asks</text>

  <!-- W2 column -->
  <rect x="1000" y="120" width="152" height="530" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
  <text class="red" x="1076" y="150" text-anchor="middle">W2 ERROR</text>
  <text class="red" x="1076" y="168" text-anchor="middle">ALERTS</text>

  <rect x="1056" y="204" width="40" height="28" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
  <path d="M 1058 207 L 1076 221 L 1094 207" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round"/>

  <text class="redcap" x="1076" y="276" text-anchor="middle">If W1, W3 or W3a</text>
  <text class="redcap" x="1076" y="295" text-anchor="middle">fails in a real run,</text>
  <text class="redcap" x="1076" y="314" text-anchor="middle">n8n sends an email</text>
  <text class="redcap" x="1076" y="333" text-anchor="middle">with:</text>

  <rect x="1014" y="352" width="124" height="28" rx="14" fill="#FFFFFF" stroke="#FECACA"/>
  <text class="chip" x="1076" y="371" text-anchor="middle">the failed step</text>
  <rect x="1014" y="390" width="124" height="28" rx="14" fill="#FFFFFF" stroke="#FECACA"/>
  <text class="chip" x="1076" y="409" text-anchor="middle">the error</text>
  <rect x="1014" y="428" width="124" height="28" rx="14" fill="#FFFFFF" stroke="#FECACA"/>
  <text class="chip" x="1076" y="447" text-anchor="middle">a link to the run</text>

  <text class="redcap" x="1076" y="560" text-anchor="middle">Tested: the email</text>
  <text class="redcap" x="1076" y="579" text-anchor="middle">arrived within</text>
  <text class="redcap" x="1076" y="598" text-anchor="middle">2 minutes.</text>

  <line x1="952" y1="214" x2="996" y2="214" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <text class="redge" x="974" y="205" text-anchor="middle">fails</text>
  <line x1="952" y1="525" x2="996" y2="525" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <text class="redge" x="974" y="516" text-anchor="middle">fails</text>

  <line x1="48" y1="676" x2="1152" y2="676" stroke="#F3F4F6" stroke-width="1"/>
  <text class="foot" x="600" y="706" text-anchor="middle">Assistants read only the main branch, so they never see a card that no person approved.</text>
</svg>
