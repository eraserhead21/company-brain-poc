<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="title desc">
  <title id="title">How the company brain works</title>
  <desc id="desc">Five steps. Collect: Drive documents, issues, design decisions and code. Draft: Claude Haiku reads only what changed and drafts cards and a brief. Redact: personal and commercial details are removed, and a pattern check catches misses. Approve: a person reviews the pull request and merges it. Ask: people and AI assistants query approved cards only.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #111827; }
    .cap { font-size: 14.5px; fill: #4B5563; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .foot { font-size: 15px; font-weight: 600; fill: #065F46; }
  </style>
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="329" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Connectors -->
  <path d="M 182 100 L 255 100 L 328 100" fill="none" stroke="#D1D5DB" stroke-width="2" marker-mid="url(#chev)"/>
  <path d="M 412 100 L 485 100 L 558 100" fill="none" stroke="#D1D5DB" stroke-width="2" marker-mid="url(#chev)"/>
  <path d="M 642 100 L 715 100 L 788 100" fill="none" stroke="#D1D5DB" stroke-width="2" marker-mid="url(#chev)"/>
  <path d="M 872 100 L 945 100 L 1018 100" fill="none" stroke="#D1D5DB" stroke-width="2" marker-mid="url(#chev)"/>

  <!-- Step 1: Collect -->
  <circle cx="140" cy="100" r="36" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <path d="M 127 90 H 135 L 138 94 H 153 V 111 H 127 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="167" cy="73" r="12" fill="#4F46E5"/>
  <text class="num" x="167" y="77.5" text-anchor="middle">1</text>
  <text class="title" x="140" y="172" text-anchor="middle">Collect</text>
  <text class="cap" x="140" y="198" text-anchor="middle">Drive documents, issues,</text>
  <text class="cap" x="140" y="218" text-anchor="middle">design decisions and code</text>

  <!-- Step 2: Draft -->
  <circle cx="370" cy="100" r="36" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="359" y="88" width="22" height="25" rx="3" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 364 96 H 376 M 364 101 H 376 M 364 106 H 372" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="397" cy="73" r="12" fill="#4F46E5"/>
  <text class="num" x="397" y="77.5" text-anchor="middle">2</text>
  <text class="title" x="370" y="172" text-anchor="middle">Draft</text>
  <text class="cap" x="370" y="198" text-anchor="middle">Claude Haiku reads only</text>
  <text class="cap" x="370" y="218" text-anchor="middle">what changed and drafts</text>
  <text class="cap" x="370" y="238" text-anchor="middle">cards and a brief</text>

  <!-- Step 3: Redact -->
  <circle cx="600" cy="100" r="36" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <path d="M 600 86 L 612 91 V 101 C 612 108 607 113 600 116 C 593 113 588 108 588 101 V 91 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 594 101 H 606" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="627" cy="73" r="12" fill="#4F46E5"/>
  <text class="num" x="627" y="77.5" text-anchor="middle">3</text>
  <text class="title" x="600" y="172" text-anchor="middle">Redact</text>
  <text class="cap" x="600" y="198" text-anchor="middle">Personal and commercial</text>
  <text class="cap" x="600" y="218" text-anchor="middle">details are removed; a</text>
  <text class="cap" x="600" y="238" text-anchor="middle">pattern check catches misses</text>

  <!-- Step 4: Approve (the gate) -->
  <circle cx="830" cy="100" r="36" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <circle cx="830" cy="100" r="13" fill="none" stroke="#059669" stroke-width="2"/>
  <path d="M 824 100 L 828.5 104.5 L 836.5 95.5" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="857" cy="73" r="12" fill="#059669"/>
  <text class="num" x="857" y="77.5" text-anchor="middle">4</text>
  <text class="title" x="830" y="172" text-anchor="middle">Approve</text>
  <text class="cap" x="830" y="198" text-anchor="middle">A person reviews the pull</text>
  <text class="cap" x="830" y="218" text-anchor="middle">request and merges it</text>

  <!-- Step 5: Ask -->
  <circle cx="1060" cy="100" r="36" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <path d="M 1052 89 H 1068 A 4 4 0 0 1 1072 93 V 103 A 4 4 0 0 1 1068 107 H 1058 L 1051 113 V 107 A 4 4 0 0 1 1048 103 V 93 A 4 4 0 0 1 1052 89 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="1087" cy="73" r="12" fill="#4F46E5"/>
  <text class="num" x="1087" y="77.5" text-anchor="middle">5</text>
  <text class="title" x="1060" y="172" text-anchor="middle">Ask</text>
  <text class="cap" x="1060" y="198" text-anchor="middle">People and AI assistants</text>
  <text class="cap" x="1060" y="218" text-anchor="middle">query approved cards only</text>

  <line x1="48" y1="272" x2="1152" y2="272" stroke="#F3F4F6" stroke-width="1"/>
  <text class="foot" x="600" y="302" text-anchor="middle">Nothing reaches step 5 without a person at step 4.</text>
</svg>
