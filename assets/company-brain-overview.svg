<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Company brain overview</title>
  <desc id="desc">Project documents pass through redaction and a person's approval. Approved learning cards reach people and AI assistants. Pay, phone numbers, passwords and names are removed and never reach a card.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .h1 { font-size: 26px; font-weight: 600; fill: #111827; }
    .sub { font-size: 17px; fill: #4B5563; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; fill: #6B7280; }
    .doc { font-size: 16px; fill: #1F2937; }
    .stage { font-size: 18px; font-weight: 600; }
    .cap { font-size: 14.5px; fill: #4B5563; }
    .chip { font-size: 13.5px; fill: #B91C1C; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #047857; }
    .card { font-size: 16px; font-weight: 600; fill: #111827; }
    .meta { font-size: 13px; fill: #6B7280; }
    .pill { font-size: 15px; font-weight: 600; fill: #1F2937; }
    .foot { font-size: 14px; fill: #6B7280; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="docicon">
      <path d="M 0 0 H 12 L 18 6 V 22 H 0 Z" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 12 0 V 6 H 18" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 4 12 H 14 M 4 16 H 11" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <text class="h1" x="48" y="64">From scattered project documents to knowledge you can trust</text>
  <text class="sub" x="48" y="96">Only what a person approves reaches people and AI assistants.</text>

  <!-- Column 1: documents -->
  <text class="label" x="48" y="150">PROJECT DOCUMENTS</text>
  <g>
    <rect x="48" y="170" width="280" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <use href="#docicon" x="66" y="185"/>
    <text class="doc" x="100" y="202">Meeting notes</text>
    <rect x="48" y="234" width="280" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <use href="#docicon" x="66" y="249"/>
    <text class="doc" x="100" y="266">Team chat</text>
    <rect x="48" y="298" width="280" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <use href="#docicon" x="66" y="313"/>
    <text class="doc" x="100" y="330">Tickets</text>
    <rect x="48" y="362" width="280" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <use href="#docicon" x="66" y="377"/>
    <text class="doc" x="100" y="394">Design documents</text>
  </g>

  <line x1="346" y1="274" x2="410" y2="274" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: the gate -->
  <text class="label" x="430" y="150">THE GATE</text>
  <g>
    <rect x="430" y="170" width="340" height="96" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
    <path d="M 468 190 L 482 196 V 207 C 482 216 476 221 468 224 C 460 221 454 216 454 207 V 196 Z" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 462 207 H 474" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text class="stage" x="502" y="204" fill="#312E81">Redact</text>
    <text class="cap" x="502" y="228">Removes personal and</text>
    <text class="cap" x="502" y="247">commercial details</text>

    <path d="M 600 266 V 280" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="430" y="284" width="340" height="96" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="468" cy="320" r="14" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <path d="M 461 320 L 466 325 L 475 315" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="stage" x="502" y="318" fill="#065F46">Approve</text>
    <text class="cap" x="502" y="342">A person reviews each</text>
    <text class="cap" x="502" y="361">card and merges it</text>
  </g>

  <!-- Removed details -->
  <text class="meta" x="430" y="414">Removed, never reaches a card</text>
  <g>
    <rect x="430" y="426" width="56" height="30" rx="15" fill="#FEF2F2" stroke="#FECACA"/>
    <text class="chip" x="458" y="446" text-anchor="middle">Pay</text>
    <line x1="444" y1="441" x2="472" y2="441" stroke="#B91C1C" stroke-width="1.4"/>
    <rect x="496" y="426" width="130" height="30" rx="15" fill="#FEF2F2" stroke="#FECACA"/>
    <text class="chip" x="561" y="446" text-anchor="middle">Phone numbers</text>
    <line x1="510" y1="441" x2="612" y2="441" stroke="#B91C1C" stroke-width="1.4"/>
    <rect x="636" y="426" width="100" height="30" rx="15" fill="#FEF2F2" stroke="#FECACA"/>
    <text class="chip" x="686" y="446" text-anchor="middle">Passwords</text>
    <line x1="650" y1="441" x2="722" y2="441" stroke="#B91C1C" stroke-width="1.4"/>
    <rect x="746" y="426" width="72" height="30" rx="15" fill="#FEF2F2" stroke="#FECACA"/>
    <text class="chip" x="782" y="446" text-anchor="middle">Names</text>
    <line x1="760" y1="441" x2="804" y2="441" stroke="#B91C1C" stroke-width="1.4"/>
  </g>

  <line x1="788" y1="274" x2="852" y2="274" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: company brain -->
  <text class="label" x="870" y="150">COMPANY BRAIN</text>
  <g>
    <rect x="890" y="170" width="262" height="150" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
    <rect x="880" y="180" width="262" height="150" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
    <rect x="870" y="190" width="262" height="150" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text class="tag" x="890" y="220">LEARNING CARD</text>
    <circle cx="1106" cy="216" r="11" fill="#059669"/>
    <path d="M 1101 216 L 1104.5 219.5 L 1111 212.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card" x="890" y="252">Request customer sandbox</text>
    <text class="card" x="890" y="274">access at kickoff</text>
    <text class="meta" x="890" y="314">Approved, cites its source</text>
  </g>

  <line x1="936" y1="344" x2="936" y2="372" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1074" y1="344" x2="1074" y2="372" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="870" y="378" width="132" height="44" rx="22" fill="#F9FAFB" stroke="#D1D5DB"/>
    <circle cx="898" cy="394" r="5.5" fill="none" stroke="#374151" stroke-width="1.8"/>
    <path d="M 888 410 C 888 403 908 403 908 410" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
    <text class="pill" x="920" y="405">People</text>

    <rect x="1008" y="378" width="144" height="44" rx="22" fill="#F9FAFB" stroke="#D1D5DB"/>
    <path d="M 1036 389 L 1038.5 397.5 L 1047 400 L 1038.5 402.5 L 1036 411 L 1033.5 402.5 L 1025 400 L 1033.5 397.5 Z" fill="#4F46E5"/>
    <text class="pill" x="1054" y="405">AI assistants</text>
  </g>

  <line x1="48" y1="478" x2="1152" y2="478" stroke="#F3F4F6" stroke-width="1"/>
  <text class="foot" x="48" y="502">Tested on unseen documents: 6 of 6 planted confidential details removed, 0 names leaked.</text>
</svg>
