# Runs every check on each pull request and on each push to main:
# unit tests, redaction, provenance, relations and the answer keys.
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the auto-marker test replays past rounds from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/run_checks.py
